name: Home Assistant Validation

on:
  push:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@v4

      - name: 🏠 Validate manifest
        uses: frenck/action-home-assistant@v1
        with:
          path: custom_components/owm_precipitation_forecast

      - name: 🧪 Test integration
        run: |
          # Additional HA-specific validation
          python -m custom_components.owm_precipitation_forecast
