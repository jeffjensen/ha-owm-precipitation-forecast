name: CI

on:
  push:
    branches:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements_test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_test.txt

    - name: Run tests with coverage
      run: |
        pytest tests/ \
          --cov=custom_components/ha_owm_precipitation_forecast \
          --cov-report=xml \
          --cov-report=term-missing \
          --verbose

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lint-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-lint-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint mypy black isort bandit
        pip install -r requirements.txt

    - name: Run Black (code formatting check)
      run: |
        black --check custom_components/ha_owm_precipitation_forecast tests

    - name: Run isort (import sorting check)
      run: |
        isort --check-only custom_components/ha_owm_precipitation_forecast tests

    - name: Run pylint
      run: |
        pylint custom_components/ha_owm_precipitation_forecast

    - name: Run mypy (type checking)
      run: |
        mypy custom_components/ha_owm_precipitation_forecast

    - name: Run bandit (security check)
      run: |
        bandit -r custom_components/ha_owm_precipitation_forecast

  validate:
    name: Home Assistant Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: HACS Validation
      uses: hacs/action@main
      with:
        category: integration

    - name: Hassfest Validation
      uses: home-assistant/actions/hassfest@master
