name: Linting & Code Quality

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run black
        run: black --check custom_components/ha_owm_precipitation_forecast tests

      - name: Run isort
        run: isort --check-only custom_components/ha_owm_precipitation_forecast tests

      - name: Run flake8
        run: flake8 custom_components/ha_owm_precipitation_forecast tests

      - name: Run pylint
        run: pylint custom_components/ha_owm_precipitation_forecast

      - name: Run mypy
        run: mypy custom_components/ha_owm_precipitation_forecast
