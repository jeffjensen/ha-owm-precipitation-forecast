name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Create ZIP for HACS
        run: |
          cd custom_components
          zip -r ../ha-owm-precipitation-forecast.zip ha_owm_precipitation_forecast/

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v1
        with:
          files: ha-owm-precipitation-forecast.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
