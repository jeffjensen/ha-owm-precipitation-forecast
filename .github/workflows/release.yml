name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel

    - name: Build Python package
      run: |
        python -m build

    - name: Create integration archive
      run: |
        cd custom_components
        zip -r ../ha-owm-precipitation-forecast-${{ github.event.release.tag_name }}.zip ha_owm_precipitation_forecast
        cd ..

    - name: Upload release archive
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./ha-owm-precipitation-forecast-${{ github.event.release.tag_name }}.zip
        asset_name: ha-owm-precipitation-forecast-${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip

    - name: Publish to PyPI (optional)
      if: github.event.release.prerelease == false
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
