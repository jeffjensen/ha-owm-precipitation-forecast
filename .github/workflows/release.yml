name: Release
on:
    release:
        types: [published]

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Package
              run: python -m build
            - name: Publish to PyPI
              uses: pypa/gh-action-pypirc@release/v1
              with:
                  user: __token__
                  password: ${{ secrets.PYPI_TOKEN }}
            - name: HACS Validation
              uses: hacs/action@main
