name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e ".[dev]"

      - name: Run all checks
        run: |
          black --check custom_components tests
          flake8 custom_components/owm_precipitation_forecast tests
          pylint custom_components/owm_precipitation_forecast
          mypy custom_components/owm_precipitation_forecast
          pytest --cov=custom_components/owm_precipitation_forecast

      - name: Validate with hassfest
        run: |
          pip install homeassistant
          hassfest -r .

      - name: Build distribution
        run: python -m build

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          generateReleaseNotes: true
          draft: false
          prerelease: false

