[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-owm-precipitation-forecast"
version = "1.0.0"
description = "Home Assistant integration for OpenWeatherMap precipitation forecasts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeff Jensen" }]
keywords = [
    "home-assistant",
    "openweathermap",
    "precipitation",
    "forecast",
    "weather",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

dependencies = ["aiohttp>=3.9.0", "homeassistant>=2024.1.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "pytest-cov>=4.1.0",
    "pytest-homeassistant-custom-component>=0.13.112",
    "black>=23.12.0",
    "isort>=5.13.2",
    "pylint>=3.0.3",
    "mypy>=1.7.1",
    "ruff>=0.1.8",
    "bandit>=1.7.5",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/jeffjensen/ha-owm-precipitation-forecast-integration"
Repository = "https://github.com/jeffjensen/ha-owm-precipitation-forecast-integration"
Issues = "https://github.com/jeffjensen/ha-owm-precipitation-forecast-integration/issues"
Documentation = "https://github.com/jeffjensen/ha-owm-precipitation-forecast-integration/blob/main/README.adoc"

[tool.setuptools]
packages = ["custom_components.owm_precipitation_forecast"]

[tool.setuptools.package-data]
"custom_components.owm_precipitation_forecast" = [
    "manifest.json",
    "strings.json",
    "translations/*.json",
    "translations/**/*.json",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.pylint.main]
py-version = "3.11"
ignore = ["tests"]
jobs = 0
load-plugins = ["pylint.extensions.code_style", "pylint.extensions.typing"]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "T"]

[tool.pylint.design]
max-attributes = 12
max-args = 10

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
    "duplicate-code",
    "format",
    "unsubscriptable-object",
]

[tool.pylint.similarities]
ignore-imports = true

[tool.pylint.typecheck]
ignored-classes = ["_CountingAttr"]

[tool.mypy]
python_version = "3.11"
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "YTT", # flake8-2020
    "S",   # bandit
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "DTZ", # flake8-datetimez
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # Pylint
    "TRY", # tryceratops
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "S101",    # Use of assert detected (needed for tests)
    "S104",    # Possible binding to all interfaces
    "PLR0913", # Too many arguments
    "TRY003",  # Avoid specifying long messages outside exception class
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert detected
    "PLR2004", # Magic value used in comparison
    "ARG001",  # Unused function argument
]

[tool.ruff.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--cov=custom_components.owm_precipitation_forecast",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-branch",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "advanced: Advanced scenario tests",
]

[tool.coverage.run]
source = ["custom_components/owm_precipitation_forecast"]
branch = true
omit = ["tests/*", "custom_components/owm_precipitation_forecast/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if 0:",
    "if False:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
