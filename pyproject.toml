[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-owm-precipitation-forecast"
version = "1.0.0"
description = "Home Assistant integration for OpenWeatherMap precipitation forecasts"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["homeassistant", "weather", "precipitation", "openweathermap"]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pylint>=2.17.0",
    "mypy>=1.0.0",
    "homeassistant>=2024.1.0",
]

[project.urls]
Homepage = "https://github.com/your-username/ha-owm-precipitation-forecast"
Repository = "https://github.com/your-username/ha-owm-precipitation-forecast.git"
Issues = "https://github.com/your-username/ha-owm-precipitation-forecast/issues"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=custom_components/ha_owm_precipitation_forecast --cov-report=term-missing"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_configs = true
