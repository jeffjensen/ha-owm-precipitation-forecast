[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-owm-precipitation-forecast-integration"
version = "1.0.0"
description = "Home Assistant integration for OpenWeatherMap precipitation forecasts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Jeff Jensen", email = "jjensen@apache.org"}
]
keywords = ["home-assistant", "openweathermap", "precipitation", "weather"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Home Assistant",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "aiohttp>=3.9.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "pylint>=2.17.0",
    "mypy>=1.5.0",
    "types-python-dateutil>=2.8.0",
    "pre-commit>=3.3.0",
]

[project.urls]
Repository = "https://github.com/jeffjensen/ha-owm-precipitation-forecast-integration"
"Bug Tracker" = "https://github.com/jeffjensen/ha-owm-precipitation-forecast-integration/issues"
Documentation = "https://github.com/jeffjensen/ha-owm-precipitation-forecast-integration/blob/main/README.md"

[tool.setuptools]
packages = ["custom_components.owm_precipitation_forecast"]
include-package-data = true

[tool.setuptools.package-data]
custom_components = [
    "owm_precipitation_forecast/manifest.json",
    "owm_precipitation_forecast/strings.json",
    "owm_precipitation_forecast/quality_scale.yaml",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "W0212",  # protected-access
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0703",  # broad-except
]

[tool.pylint.format]
max-line-length = 88

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--cov=custom_components/owm_precipitation_forecast",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:coverage_html_report",
    "--cov-report=xml",
    "--cov-fail-under=75",
]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.isort]
profile = "black"
line_length = 88
skip = [".venv", "venv", "build", "dist"]
known_first_party = ["custom_components"]
