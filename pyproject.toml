[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-owm-precipitation-forecast"
version = "1.0.0"
description = "Home Assistant integration for OpenWeatherMap precipitation forecast"
readme = "README.md"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
]
dynamic = ["keywords", "classifiers"]

[project.urls]
Homepage = "https://github.com/yourusername/ha-owm-precipitation-forecast"
Issues = "https://github.com/yourusername/ha-owm-precipitation-forecast/issues"
Repository = "https://github.com/yourusername/ha-owm-precipitation-forecast"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30

[tool.coverage.run]
source = ["custom_components/ha_owm_precipitation_forecast"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 90

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\\.pyi?$'
extend-exclude = '''
/(
    \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint.MASTER]
ignore = ["tests"]
extension-pkg-whitelist = ["pydantic"]

[tool.pylint.BASIC]
good-names = ["id", "i", "j", "k", "ex", "Run", "_", "dt"]

[tool.pylint.FORMAT]
max-line-length = 100

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "too-few-public-methods",
    "duplicate-code",
    "fixme",
]

[tool.mypy]
python_version = "3.11"
show_error_codes = true
follow_imports = "normal"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
